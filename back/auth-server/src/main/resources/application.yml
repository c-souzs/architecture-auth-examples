spring:
  application:
    name: auth-server
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: auth
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: auth
    default-schema: auth
    create-schemas: true
    validate-on-migrate: true
    out-of-order: false

server:
  port: 8080

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

rsa:
  private-key: classpath:keys/private.pem
  public-key: classpath:keys/public.pem
