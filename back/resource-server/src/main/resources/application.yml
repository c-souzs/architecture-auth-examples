spring:
  application:
    name: resource-server
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: commerce
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: commerce
    default-schema: commerce
    create-schemas: true
    validate-on-migrate: true
    out-of-order: false

server:
  port: 8081

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

rsa:
  public-key: classpath:keys/public.pem
